<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="bg">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" ry="108" fill="#1a7a6d"/>
  <g clip-path="url(#bg)">
    <!-- Small sun — upper right, with outline -->
    <circle cx="385" cy="115" r="42" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="6" stroke-opacity="0.45"/>
    <!-- Back layer: tallest peak -->
    <path d="M40,450
      C80,400 130,300 185,220
      C215,178 238,140 252,118
      C257,110 261,110 266,118
      C280,140 303,178 333,220
      C388,300 438,400 478,450
      Z"
      fill="#fff" opacity="0.14"/>
    <!-- Middle layer: medium peak, shifted left -->
    <path d="M-30,450
      C15,405 70,320 125,265
      C158,232 178,208 194,192
      C200,186 206,186 212,192
      C228,208 248,232 281,265
      C336,320 395,405 440,450
      Z"
      fill="#fff" opacity="0.28"/>
    <!-- Front layer: gentle rolling hill, shifted right -->
    <path d="M130,450
      C168,415 220,360 278,315
      C310,293 332,278 348,268
      C355,264 362,264 369,268
      C385,278 407,293 439,315
      C497,360 535,415 560,450
      Z"
      fill="#fff" opacity="0.48"/>
    <!-- Subtle ground glow -->
    <rect x="0" y="442" width="512" height="80" fill="#fff" opacity="0.05"/>
  </g>
</svg>
